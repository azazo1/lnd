[package]
name = "lnd"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lnd-client"
path = "src/bin/lnd-client.rs"

[[bin]]
name = "lnd-server"
path = "src/bin/lnd-server.rs"

[dependencies]
anyhow = "1.0.100"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
async-stream = "0.3.6"
axum = { version = "0.8.1", features = ["json", "macros"] }
bytes = "1.10.1"
clap = { version = "4.5.39", features = ["derive", "env"] }
dirs = "6.0.0"
eventsource-stream = "0.2.3"
futures = "0.3.31"
hostname = "0.4.1"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["full"] }
if-addrs = "0.13.3"
libc = "0.2.177"
parking_lot = "0.12.3"
rand = "0.9.2"
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "http2", "charset", "json", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.9.8"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
url = "2.5.4"
urlencoding = "2.1.3"
uuid = { version = "1.17.0", features = ["serde", "v4"] }

[build-dependencies]
cbindgen = "0.29.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
serial_test = "3.2.0"
tempfile = "3.20.0"
