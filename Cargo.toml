[package]
name = "lnd-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "HTTP(S)-based local network service discovery client and server"
readme = "README.md"
repository = "https://github.com/azazo1/lnd"
homepage = "https://github.com/azazo1/lnd"
documentation = "https://docs.rs/lnd-core"
keywords = ["discovery", "lan", "service-discovery", "sse", "http"]
categories = ["network-programming", "web-programming"]
exclude = [
    "AGENTS.md",
    ".gitignore",
    "bindings/**",
    "impls/**",
    "include/**",
    "examples/sdk/**",
    "cbindgen.toml",
    "justfile",
]

[lib]
name = "lnd"

[workspace]
resolver = "3"
members = ["bindings/c/native", "bindings/python/native"]

[[bin]]
name = "lnd-client"
path = "src/bin/lnd-client.rs"

[[bin]]
name = "lnd-server"
path = "src/bin/lnd-server.rs"

[dependencies]
anyhow = "1.0.104"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["json", "macros"] }
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
eventsource-stream = "0.2.3"
futures = "0.3.34"
hostname = "0.4.2"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["full"] }
if-addrs = "0.15.0"
libc = "0.2.189"
parking_lot = "0.12.5"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-tls", "http2", "charset", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serial_test = "3.5.0"
tempfile = "3.27.0"
