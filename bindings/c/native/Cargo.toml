[package]
name = "lnd-c-native"
version = "0.1.0"
edition = "2024"

[lib]
name = "lnd"
crate-type = ["rlib", "cdylib"]

[dependencies]
futures = "0.3.34"
lnd_core = { package = "lnd-core", path = "../../.." }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
cbindgen = "0.29.4"

[dev-dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
lnd_core = { package = "lnd-core", path = "../../.." }
