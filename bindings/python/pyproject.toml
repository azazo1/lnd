[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "lnd-sdk"
version = "0.1.0"
description = "High-level Python SDK for lnd centralized LAN discovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "azazo1" }
]
keywords = ["discovery", "lan", "mdns", "network", "sse"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "."
module-name = "lnd._native"
features = ["pyo3/abi3-py310", "pyo3/extension-module"]
include = [
  "lnd/py.typed",
]
