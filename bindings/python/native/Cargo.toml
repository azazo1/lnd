[package]
name = "lnd-python-native"
version = "0.1.0"
edition = "2024"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.31"
lnd = { path = "../../.." }
pyo3 = { version = "0.23.5", features = ["abi3-py310", "extension-module"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.0", features = ["rt-multi-thread"] }
