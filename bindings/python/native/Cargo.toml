[package]
name = "lnd-python-native"
version = "0.1.2"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.34"
lnd = { package = "lnd-core", path = "../../.." }
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
